plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"typestones" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Own folder for the dev server, so client and server can run at the same time.
	runs {
		// Room for a big mod pack in run/mods, like the memory setting in Prism. Lower it if the PC has less RAM.
		client {
			vmArg "-Xmx8G"
			// A fixed name, so the dev server keeps its op and player data between runs (offline mode).
			programArgs "--username", "Konitor"
		}
		server {
			runDir "run-server"
		}
	}
}

// Game tests in src/gametest run as part of "build" (task runGameTest), on a dedicated server.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'typestones-gametest'
		enableClientGameTests = false
		eula = true
	}
}
tasks.named('check') { dependsOn 'runGameTest' }

repositories {
	// Mod Menu, a soft dependency: compiled against, not shipped.
	maven {
		url = "https://maven.terraformersmc.com/releases"
		content { includeGroup "com.terraformersmc" }
	}
	// CC: Tweaked, a soft dependency: compiled against, not shipped.
	maven {
		url = "https://maven.squiddev.cc"
		content { includeGroup "cc.tweaked" }
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Soft dependencies: Typestones works without them and only uses them when they are installed.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-core-api:${project.cc_tweaked_version}") { transitive = false }
	compileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-fabric-api:${project.cc_tweaked_version}") { transitive = false }
}

// The glyph generator: a small Java program, not part of the mod. It draws the glyph textures of every
// font face in fonts/ and writes the JSON files of the Typestone blocks. Run "./gradlew generateGlyphs" after changing a face, then commit the textures.
// A font from elsewhere, e.g. one installed on the computer:
//   ./gradlew generateGlyphs -Pfont=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf -Pface=dejavu_bold
sourceSets {
	// Billboard API, a soft dependency without a maven: a compile-only copy of its API package.
	billboardApi {
		compileClasspath += configurations.compileClasspath
	}
	main {
		compileClasspath += billboardApi.output
	}
	// The game tests drive the Lua functions directly, so they get the copy at run time too.
	gametest {
		compileClasspath += billboardApi.output
		runtimeClasspath += billboardApi.output
	}
	glyphgen {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

def glyphArgs = [
	file('src/main/resources').path,
	layout.buildDirectory.dir('glyph-preview').get().asFile.path,
	file('fonts').path
]

tasks.register('generateGlyphs', JavaExec) {
	group = 'typestones'
	description = 'Writes the letter files of the font faces in fonts/ (or of -Pfont=<file> -Pface=<name>).'
	classpath = sourceSets.glyphgen.runtimeClasspath
	mainClass = 'de.knito.typestones.glyphgen.GlyphGen'
	jvmArgs '-Djava.awt.headless=true'
	def font = providers.gradleProperty('font')
	args glyphArgs + (font.present ? [font.get(), providers.gradleProperty('face').getOrElse('custom')] : [])
}

// Part of "build": fails when the committed letter files don't match the generator.
def checkGlyphs = tasks.register('checkGlyphs', JavaExec) {
	group = 'verification'
	description = 'Checks that the letter files are up to date.'
	classpath = sourceSets.glyphgen.runtimeClasspath
	mainClass = 'de.knito.typestones.glyphgen.GlyphGen'
	jvmArgs '-Djava.awt.headless=true', '-Dglyphgen.check=true'
	args glyphArgs
}
tasks.named('check') { dependsOn checkGlyphs }

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
